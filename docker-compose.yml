version: '3.8'

services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/nginx.conf.template:ro
    environment:
      - ACTIVE_POOL=${ACTIVE_POOL}
      - PORT=${PORT:-3000}
    command: >
      /bin/sh -c "
        # Set backup flags based on ACTIVE_POOL
        if [ "$$ACTIVE_POOL" = "green" ]; then
          export BLUE_BACKUP="backup";
          export GREEN_BACKUP="";
        else
          export BLUE_BACKUP="";
          export GREEN_BACKUP="backup";
        fi;
        # Generate config with envsubst
        envsubst '$$PORT $$BLUE_BACKUP $$GREEN_BACKUP' < /etc/nginx/nginx.conf.template > /etc/nginx/conf.d/default.conf;
        exec nginx -g 'daemon off;';
      "
    depends_on:
      - app_blue
      - app_green
    restart: always

  app_blue:
    image: ${BLUE_IMAGE}
    environment:
      - APP_POOL=blue
      - RELEASE_ID=${RELEASE_ID_BLUE}
      - PORT=${PORT:-3000}
    ports:
      - "8081:${PORT:-3000}"
    restart: on-failure

  app_green:
    image: ${GREEN_IMAGE}
    environment:
      - APP_POOL=green
      - RELEASE_ID=${RELEASE_ID_GREEN}
      - PORT=${PORT:-3000}
    ports:
      - "8082:${PORT:-3000}"
    restart: on-failure